<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel da Di</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Trocar --acc e o degradê do body pela identidade do cliente. */
:root{--bg:#F2F0ED;--card:#FFFFFF;--fg:#171815;--muted:#66625B;--line:#DAD6CF;--acc:#0C7A78;--err:#B3372F;
  --serif:"Instrument Serif",Georgia,serif;--sans:"Hanken Grotesk",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#121412;--card:#1C1E1B;--fg:#EDEBE6;--muted:#A09C93;--line:#33362F;--acc:#4FC1BE;--err:#EE8A82;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(120deg,#0A5F5D 0%,#0C7A78 42%,#8A8374 100%);color:var(--fg);font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:380px;background:var(--card);box-shadow:0 20px 50px rgba(10,30,28,.3);border-radius:18px;padding:32px 28px;display:flex;flex-direction:column;gap:18px}
.logo{width:56px;height:56px;color:var(--fg)}
small{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
h1{font-family:var(--serif);font-size:32px;font-weight:400;line-height:1.05;margin:4px 0 0}
p{margin:0;font-size:14px;color:var(--muted)}
form{display:flex;flex-direction:column;gap:12px}
label{font-size:12px;font-weight:700}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.remember{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-weight:400}
.remember input{accent-color:var(--acc);width:16px;height:16px}
button{font-family:var(--sans);font-weight:700;font-size:14px;padding:12px;border:0;border-radius:99px;background:var(--acc);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--err);font-size:13px;min-height:1.2em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<main class="card">
  <svg class="logo" viewBox="0 0 100 100" fill="none" aria-hidden="true"><circle cx="50" cy="30" r="21" stroke="currentColor" stroke-width="3.6"/><circle cx="70" cy="50" r="21" stroke="currentColor" stroke-width="3.6"/><circle cx="50" cy="70" r="21" stroke="currentColor" stroke-width="3.6"/><circle cx="30" cy="50" r="21" stroke="currentColor" stroke-width="3.6"/></svg>
  <div><small>Acesso restrito</small><h1>Painel da Di</h1></div>
  <p>Conteúdo reservado. Digite a senha para entrar.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Senha</label>
    <input type="password" id="pw" required autofocus>
    <label class="remember"><input type="checkbox" id="rem"> Lembrar neste aparelho</label>
    <button id="go" type="submit">Entrar</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <p class="foot">Projeto conduzido por Diana Dias · Estrategista digital</p>
</main>

var KEY='painel-di-k';
var MARK='PAINEL-OK:';
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function hex(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)))}
async function deriveRaw(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,256);
}
function render(html){
  // Troca cabeça e corpo pelos do painel, sem herdar nada da tela de senha.
  // Cada script é recriado com os mesmos atributos (o bloco de dados JSON precisa manter type e id).
  var d=new DOMParser().parseFromString(html,'text/html');
  var root=document.documentElement;
  root.replaceChild(document.importNode(d.head,true),document.head);
  root.replaceChild(document.importNode(d.body,true),document.body);
  [].slice.call(document.body.querySelectorAll('script')).forEach(function(old){
    var s=document.createElement('script');
    [].slice.call(old.attributes).forEach(function(a){s.setAttribute(a.name,a.value)});
    s.textContent=old.textContent;old.parentNode.replaceChild(s,old);
  });
  window.scrollTo(0,0);
}
async function openWith(raw){
  var key=await crypto.subtle.importKey('raw',raw,'AES-CBC',false,['decrypt']);
  var out=await crypto.subtle.decrypt({name:'AES-CBC',iv:b64(P.iv)},key,b64(P.ct));
  var txt=new TextDecoder().decode(out);
  if(txt.indexOf(MARK)!==0) throw new Error('bad');
  window.__painelKey=raw;
  render(txt.slice(MARK.length));
}
(async function(){
  try{var saved=localStorage.getItem(KEY); if(saved){await openWith(b64(saved));return}}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}
})();
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var btn=document.getElementById('go'),err=document.getElementById('err');
  if(!window.crypto||!crypto.subtle){err.textContent='Abra o painel pelo endereço oficial (https).';return}
  btn.disabled=true;btn.textContent='Verificando…';err.textContent='';
  try{
    var raw=await deriveRaw(document.getElementById('pw').value.trim());
    if(document.getElementById('rem').checked){try{localStorage.setItem(KEY,hex(raw))}catch(_){}}
    await openWith(raw);
  }catch(x){
    err.textContent='Senha incorreta. Confira e tente de novo.';
    btn.disabled=false;btn.textContent='Entrar';
  }
});
</script>
